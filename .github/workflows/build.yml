name: Build Linux Dedicated Server

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test and build server
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: hardtab/tinyblock-server/.github/workflows/build-self-hosted.yml@main
    permissions:
      contents: write
