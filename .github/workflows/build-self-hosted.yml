name: Build Linux Dedicated Server (self-hosted)

on:
  workflow_call:

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    name: Test and build server
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, hardtab-linux-build]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up pinned Godot and Linux export templates
        run: |
          set -euo pipefail
          setup_dir="$(mktemp -d "${RUNNER_TEMP}/tinyblock-server-godot.XXXXXX")"
          echo "GODOT_SETUP_TMP=$setup_dir" >> "$GITHUB_ENV"
          release="${GODOT_VERSION}-stable"
          base="https://github.com/godotengine/godot-builds/releases/download/${release}"
          curl -fsSL "$base/Godot_v${release}_linux.x86_64.zip" -o "$setup_dir/godot.zip"
          python3 - "$setup_dir/godot.zip" "$setup_dir" <<'PY'
          from pathlib import Path
          from sys import argv
          from zipfile import ZipFile

          with ZipFile(argv[1]) as archive:
              archive.extractall(Path(argv[2]))
          PY
          godot_bin="$setup_dir/Godot_v${release}_linux.x86_64"
          chmod +x "$godot_bin"
          [[ "$("$godot_bin" --version)" == "${GODOT_VERSION}.stable."* ]]
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [[ ! -f "$template_dir/linux_release.x86_64" ]]; then
            curl -fsSL "$base/Godot_v${release}_export_templates.tpz" -o "$setup_dir/templates.tpz"
            mkdir -p "$template_dir"
            python3 - "$setup_dir/templates.tpz" "$template_dir" <<'PY'
          from pathlib import Path
          from sys import argv
          from zipfile import ZipFile

          destination = Path(argv[2])
          with ZipFile(argv[1]) as archive:
              for name in ('linux_release.x86_64', 'linux_debug.x86_64', 'version.txt'):
                  (destination / name).write_bytes(archive.read('templates/' + name))
          PY
          fi
          chmod +x "$template_dir/linux_release.x86_64"

      - name: Import and parse project
        run: '"$GODOT_BIN" --headless --path . --editor --quit'

      - name: Run server tests
        run: '"$GODOT_BIN" --headless --path . tests/server_test_runner.tscn'

      - name: Export release package
        run: |
          set -euo pipefail
          mkdir -p build/export build/package/tinyblock-server/addons/webrtc_native/lib
          "$GODOT_BIN" --headless --path . --export-release \
            "Dedicated Server (Linux/X11)" \
            build/export/tinyblock-server.x86_64
          test -x build/export/tinyblock-server.x86_64
          test -s build/export/tinyblock-server.pck
          install -m 0755 build/export/tinyblock-server.x86_64 \
            build/package/tinyblock-server/tinyblock-server.x86_64
          install -m 0644 build/export/tinyblock-server.pck \
            build/package/tinyblock-server/tinyblock-server.pck
          install -m 0755 addons/webrtc_native/lib/libwebrtc_native.linux.template_release.x86_64.so \
            build/package/tinyblock-server/addons/webrtc_native/lib/
          install -m 0755 deploy/run-server.sh build/package/tinyblock-server/
          install -m 0644 README.md SELF_HOSTING.md LICENSE THIRD_PARTY_NOTICES.md \
            build/package/tinyblock-server/
          tar -C build/package -czf build/tinyblock-server-linux-x86_64.tar.gz tinyblock-server
          cd build
          shasum -a 256 tinyblock-server-linux-x86_64.tar.gz \
            > tinyblock-server-linux-x86_64.tar.gz.sha256

      - name: Upload release-ready artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: tinyblock-server-linux-x86_64
          path: |
            build/tinyblock-server-linux-x86_64.tar.gz
            build/tinyblock-server-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 5

      - name: Remove task-local Godot setup
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${GODOT_SETUP_TMP:-}" && "$GODOT_SETUP_TMP" == "$RUNNER_TEMP"/tinyblock-server-godot.* ]]; then
            rm -rf -- "$GODOT_SETUP_TMP"
          fi
          rm -rf -- .godot build/export build/package \
            build/tinyblock-server-linux-x86_64.tar.gz \
            build/tinyblock-server-linux-x86_64.tar.gz.sha256

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: [self-hosted, Linux, X64, hardtab-linux-build]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: tinyblock-server-linux-x86_64
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/tinyblock-server-linux-x86_64.tar.gz
            release/tinyblock-server-linux-x86_64.tar.gz.sha256
          generate_release_notes: true

      - name: Remove downloaded release files
        if: always()
        run: rm -rf -- release
